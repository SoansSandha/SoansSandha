<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 352" width="860" height="352" role="img" aria-label="About SoansSandha">
<style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:13px;fill:#e6e2d6}.dim{fill:#8b8f9a}.key{fill:#f0b429;font-weight:600}.hi{fill:#ffd96b;font-weight:600}.sm{font-size:11px}.ln{opacity:0;animation:in .45s ease-out both}@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style>
<rect width="860" height="352" rx="10" fill="#14161c" stroke="#2a2e38"/>
<text class="dim sm" x="40" y="22">~/SoansSandha/whoami</text>
<line x1="0" x2="860" y1="32" y2="32" stroke="#2a2e38"/>
<line x1="40" x2="820" y1="70" y2="70" stroke="#2a2e38"/>
<text class="ln hi" x="40" y="62" style="animation-delay:0.25s">soans@github</text><text class="ln key" x="40" y="86" style="animation-delay:0.35s">Now</text><text class="ln " x="150" y="86" style="animation-delay:0.35s">Building small web apps: a Spotify playlist sorter and a multiplayer browser game</text><text class="ln key" x="40" y="108" style="animation-delay:0.45s">Stack</text><text class="ln " x="150" y="108" style="animation-delay:0.45s">Remix, React and Tailwind</text><text class="ln key" x="40" y="130" style="animation-delay:0.55s">Content</text><text class="ln " x="150" y="130" style="animation-delay:0.55s">Sanity</text><text class="ln key" x="40" y="152" style="animation-delay:0.65s">Infra</text><text class="ln " x="150" y="152" style="animation-delay:0.65s">Terraform</text><text class="ln key" x="40" y="174" style="animation-delay:0.75s">Also</text><text class="ln " x="150" y="174" style="animation-delay:0.75s">JavaScript, TypeScript, Vite, Supabase, Framer Motion</text><text class="ln key" x="40" y="206" style="animation-delay:0.85s">Highlights</text><text class="ln hi" x="150" y="206" style="animation-delay:0.85s">running-order</text><text class="ln " x="150" y="228" style="animation-delay:0.95s">Sorts a Spotify playlist for good without resetting date-added. It moves only</text><text class="ln " x="150" y="250" style="animation-delay:1.05s">the tracks that have to move, shows a preview first, and has 291 tests.</text><text class="ln hi" x="150" y="272" style="animation-delay:1.15s">placeless</text><text class="ln " x="150" y="294" style="animation-delay:1.25s">A Spyfall-style multiplayer game in the browser. The secrets never reach the</text><text class="ln " x="150" y="316" style="animation-delay:1.35s">client: Postgres row-level security and server-side roles keep it fair.</text>
</svg>